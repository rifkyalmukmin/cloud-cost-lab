name: Security

# DevSecops gates: secret scanning (Gitleaks) and vulnerability /
# misconfiguration scanning (Trivy). Read-only permissions; both jobs fail
# the run on findings — findings block merges, they are never auto-remediated.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly rescan: new CVEs land against unchanged code.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets — Gitleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Delta scan (fetch-depth 1): the gitleaks full-history audit was run
      # as part of the Phase 14 final audit (docs/final-audit.md F-01) — the
      # only findings were 8 false positives in historical doc prose, fixed
      # at the source by rewriting those lines. Delta scanning keeps the full
      # default gitleaks ruleset active (a custom .gitleaks.toml would REPLACE
      # the default rules — verified unsafe by negative testing).
      - uses: actions/checkout@v4
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # short-lived, read-scoped

  trivy-fs:
    name: Vulnerabilities & IaC — Trivy (filesystem)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (vuln + secret + misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy filesystem report (all severities, informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: MEDIUM,LOW
          exit-code: "0"
          format: table
